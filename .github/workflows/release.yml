name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const lockfile = require("./package-lock.json");
            const manifest = require("./manifest.json");
            const packageJson = require("./package.json");
            const versions = require("./versions.json");
            const releaseTag = process.env.RELEASE_TAG;
            const versionsMatch =
              manifest.version === releaseTag &&
              packageJson.version === releaseTag &&
              lockfile.version === releaseTag &&
              lockfile.packages[""].version === releaseTag;
            if (!versionsMatch) {
              throw new Error(`Release metadata does not consistently match tag ${releaseTag}`);
            }
            if (versions[releaseTag] !== manifest.minAppVersion) {
              throw new Error(`versions.json is missing the compatibility entry for ${releaseTag}`);
            }
          '

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              main.js \
              manifest.json \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              main.js \
              manifest.json \
              --generate-notes \
              --title "Tagatha $RELEASE_TAG"
          fi
